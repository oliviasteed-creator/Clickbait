<!doctype html>
<!-- Popup: the settings panel that opens from the toolbar icon. -->
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <h1>Random Click FX</h1>

    <label class="row">
        <span>Enabled</span>
        <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
        <span>Volume</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" />
    </label>

    <label class="row">
        <span>Images</span>
        <select id="imagePack">
            <option value="mixed">Mixed</option>
            <option value="emoji">Emoji</option>
            <option value="shapes">Shapes</option>
            <option value="files">Image files</option>
        </select>
    </label>

    <button id="clear">Clear images</button>
    <p id="status"></p>

    <script src="popup.js"></script>
</body>
</html>
